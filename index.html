    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jeric Ashley S. Rulete — full-stack web developer in Cebu City. BS Computer Science, UP Cebu (2026). Next.js, TypeScript and PostgreSQL projects, with tests."
    />
    <meta name="theme-color" content="#111827" />
    <!--
      GitHub Pages can't set response headers, but browsers still enforce a
      CSP delivered via meta tag. Scoped to the origins this site actually
      talks to: Web3Forms (contact form), GitHub API (project stats),
      hCaptcha (contact form), Google Fonts, and jsDelivr/Google Storage
      (MediaPipe WASM + model, loaded by the Camera/Gestures apps).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://*.hcaptcha.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.hcaptcha.com; connect-src 'self' https://api.web3forms.com https://api.github.com https://cdn.jsdelivr.net https://storage.googleapis.com https://*.hcaptcha.com; frame-src https://*.hcaptcha.com https://hcaptcha.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self';"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jeric Rulete | Portfolio" />
    <meta
      property="og:description"
      content="Full-stack web developer in Cebu City. BS Computer Science, UP Cebu (2026). Next.js, TypeScript and PostgreSQL projects, with automated tests."
    />
    <meta property="og:url" content="https://jasrulete.github.io/portfolio/" />
    <meta
      property="og:image"
      content="https://jasrulete.github.io/portfolio/og-image.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jeric Rulete | Portfolio" />
    <meta
      name="twitter:description"
      content="Full-stack web developer in Cebu City. BS Computer Science, UP Cebu (2026). Next.js, TypeScript and PostgreSQL projects, with automated tests."
    />
    <meta

    />
    <title>Jeric Rulete | Portfolio</title>
  </head>

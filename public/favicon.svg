<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The j² icon (docs/brand.md §4): a lowercase "j" in ink with a superscript
    "2" in the mango-amber accent, on an opaque dark square so it survives a
    light tab strip as well as a dark one. Paths only, so nothing here needs a
    webfont. public/favicon.svg is a copy of this file; logo.png is rendered
    from it by docs/brand/logo-icon-512.html.
  -->
